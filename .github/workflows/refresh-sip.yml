name: Refresh Embedded Data (SIP index + market data + pending rezones)

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday at 6am PT (14:00 UTC)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

# A manual run overlapping the Monday cron would have both jobs commit and push the same
# branch — the loser fails on a non-fast-forward. Queue them instead of cancelling, so a
# manual run never silently discards the scheduled refresh's work.
concurrency:
  group: refresh-embedded-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      # Pinned to a SHA, not the mutable v4 tag: this job holds contents:write and pushes
      # straight to the live site, so a retagged v4 would run unreviewed code with that token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Fetch and embed SIP index
        run: bash refresh-sip-index.sh

      - name: Fetch and embed market data (Zillow + FRED)
        run: bash refresh-market-data.sh

      # Recomputed rather than pinned, so the index self-corrects as Council adopts pieces
      # of the rezone: an ordinance that passes lands in the live zoning layer, and those
      # polygons drop out of "pending" on the next Monday without anyone touching the code.
      - name: Recompute pending-rezone index
        run: bash refresh-rezone-index.sh

      - name: Build weekly digest (whats-new.html + feed.xml)
        run: bash build-whats-new.sh

      # The three baked constants above grow every week and nothing was watching. index.html
      # went 264 KB -> 278 KB raw (72 -> 77 KB gzipped) in a fortnight without anyone
      # noticing. Gzipped is the number that matters — it's what users actually download.
      # Warn well before it hurts; the whole page is one request on the critical path.
      - name: Check page size budget
        run: |
          BUDGET=102400   # 100 KB gzipped
          SIZE=$(gzip -c index.html | wc -c)
          RAW=$(wc -c < index.html)
          echo "index.html: $RAW bytes raw, $SIZE bytes gzipped (budget $BUDGET)"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::index.html is $SIZE bytes gzipped, over the $BUDGET budget."
            exit 1
          fi
          # Surface the trend even when it passes, so growth is visible in the run log.
          echo "::notice::Page size $((SIZE * 100 / BUDGET))% of budget ($SIZE / $BUDGET bytes gzipped)"

      # The refresh scripts rewrite three constants inside the app's only script tag by regex.
      # They are well guarded — each aborts unless it replaced exactly once and the payload
      # clears a plausibility floor — but nothing checked that the RESULT still parses. This
      # is the last gate before a push that goes straight to the live site, and a syntax error
      # here would take the whole page down with every other check still reporting success.
      - name: Syntax-check the rewritten page
        run: |
          python3 - <<'PY' > /tmp/app.js
          import re, sys
          s = open("index.html", encoding="utf-8").read()
          m = re.search(r"<script>\n(.*)\n</script>\n</body>", s, re.S)
          if not m:
              sys.exit("could not locate the inline app script — the page structure changed")
          print(m.group(1))
          PY
          node --check /tmp/app.js
          echo "::notice::Inline app script parses cleanly"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html whats-new.html feed.xml
          git diff --cached --quiet || (
            git commit -m "chore: refresh embedded data $(date +%Y-%m-%d)" &&
            git push
          )

      # Workflow status alone doesn't prove anything shipped — a Pages deploy can fail after a
      # clean push and silently leave the old build up. This checks what's actually served.
      - name: Verify the live site is serving this build
        run: bash verify-deploy.sh

      # verify-deploy.sh only compares SHA-256 of local vs served, so it reports success for a
      # page that is byte-perfect and completely broken. This actually loads the deployed site
      # and checks it works: data sources populated, no console errors, no uncaught exceptions.
      # Exit 1 means the site is broken, exit 2 means the checker could not run — only the
      # former should fail the job, since a Chrome problem on the runner says nothing about
      # the site and would otherwise raise a false alarm every time it flaked.
      - name: Health-check the deployed site
        run: |
          # Preconditions are checked rather than assumed, and a missing one downgrades to a
          # warning. Deliberately not adding actions/setup-node: this job holds contents:write
          # and pushes straight to the live site, which is why checkout is pinned to a SHA, and
          # a new unpinned action would undo that reasoning for a nice-to-have check.
          # health-check.mjs needs Node 22+ for the built-in WebSocket.
          MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$MAJOR" -lt 22 ]; then
            echo "::warning::Runner has Node $MAJOR, health-check needs 22+ — skipping"
            exit 0
          fi
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)
          if [ -z "$CHROME_BIN" ]; then
            echo "::warning::No Chrome on the runner — skipping health check"
            exit 0
          fi
          echo "Using Node $MAJOR and $CHROME_BIN"
          set +e
          CHROME_PATH="$CHROME_BIN" node health-check.mjs
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then echo "::notice::Live site healthy"; exit 0; fi
          # Exit 2 is "the checker could not run", which says nothing about the site — warn,
          # don't fail, or a flaky runner raises a false alarm about a healthy deploy.
          if [ "$CODE" -eq 2 ]; then echo "::warning::Health check could not run (exit 2) — site status unknown"; exit 0; fi
          echo "::error::Live site is serving this build but the page is broken (exit $CODE)"
          exit 1

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Weekly data refresh failed — $(date +%Y-%m-%d)" \
            --body "The scheduled embedded-data refresh (SIP index / Zillow / FRED / pending rezones) failed. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
