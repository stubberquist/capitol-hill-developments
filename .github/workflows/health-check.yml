name: Daily health check

# The daily check used to run only as a cron job inside an interactive Claude session, which
# dies with the session and went missing at least twice. This is the durable copy: same
# script, GitHub's scheduler, and a failure opens (or updates) an issue, which emails.
#
# Exit codes (see health-check.mjs): 0 clean · 1 site problem · 2 checker could not run ·
# 3 a City data source is down at the source and the site is handling it. Only 1 fails.

on:
  schedule:
    # 14:42 UTC = 07:42 PDT / 06:42 PST. After SDOT's nightly publish (~11:25-11:40 UTC), so an
    # empty republish is caught the same morning. Off the hour: GitHub delays :00 schedules most.
    - cron: '42 14 * * *'
  workflow_dispatch:

concurrency:
  group: daily-health-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      # Pinned to the same SHA as refresh-sip.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Health-check the live site
        id: check
        run: |
          MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$MAJOR" -lt 22 ]; then echo "::warning::Runner has Node $MAJOR, health-check needs 22+ — skipping"; exit 0; fi
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || true)
          if [ -z "$CHROME_BIN" ]; then echo "::warning::No Chrome on the runner — skipping"; exit 0; fi
          set +e
          CHROME_PATH="$CHROME_BIN" node health-check.mjs | tee result.txt
          CODE=${PIPESTATUS[0]}
          # Exit 2 is the checker failing to run, usually a runner glitch. On 2026-10-15 Chrome
          # never reported a debugging port, and that run — the one day SDOT was down — saw
          # nothing. Such glitches rarely repeat back to back, so try once more.
          if [ "$CODE" -eq 2 ]; then
            echo "::notice::Checker could not run (exit 2) — retrying once in 30 s"
            sleep 30
            CHROME_PATH="$CHROME_BIN" node health-check.mjs | tee result.txt
            CODE=${PIPESTATUS[0]}
          fi
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            0) echo "::notice::Live site healthy" ;;
            2) echo "::warning::Health check could not run (exit 2) — site status unknown" ;;
            3) echo "::warning::A City data source is down upstream (exit 3) — the site is handling it" ;;
            *) echo "::error::Live site has a problem (exit $CODE)"; exit 1 ;;
          esac

      # One open issue per incident: a problem that lasts a week adds comments to the same
      # issue rather than opening seven.
      - name: Open or update issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PROBLEMS=$(sed -n '/^ATTENTION/,$p' result.txt 2>/dev/null | head -20)
          BODY=$(printf 'The daily health check found a problem on the live site.\n\n```\n%s\n```\n\nLogs: %s\n' "${PROBLEMS:-see logs}" "$RUN")
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Daily health check failed in:title" --json number -q '.[0].number' || true)
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Daily health check failed — $(date +%Y-%m-%d)" --body "$BODY" || true
          fi

      # Exit 0 or 3 closes it: both mean the site itself is clean (3 adds "and a City source is
      # down upstream"). Exit 2 says nothing about the site. It used to need a full exit 0, but a
      # long-running City gap — Bellevue publishing no project values from September 2026 —
      # holds the check at exit 3 for weeks, and a site-failure issue would never have closed.
      # Issue #3 sat open for a week after one failure on 2026-10-26 for want of this step.
      - name: Close the failure issue once the site is clean again
        if: steps.check.outputs.code == '0' || steps.check.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Daily health check failed in:title" --json number -q '.[0].number' || true)
          if [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "Site clean again — closing. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi

      # Most exit-3 outages mend themselves (SDOT republishing an empty layer) and stay a
      # warning. These don't: a source that has gone stale, answers with an error, or has
      # stopped carrying a field needs a person — Bellevue's layer sat frozen for seven weeks
      # behind a healthy row count. One issue, opened once; a later run comments only when a
      # problem appears that the issue hasn't already recorded (digits are ignored, so "54 days
      # old" becoming "55" is not news), and it closes on the first run with none left.
      - name: Open, update or close the stale-source issue
        if: steps.check.outputs.code == '0' || steps.check.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LINES=$(sed -n '/^UPSTREAM/,/^$/p' result.txt 2>/dev/null | grep -E 'is stale|answers with an error|Bellevue is publishing' | sed 's/^ *//' || true)
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "City data source needs attention in:title" --json number -q '.[0].number' || true)
          if [ -z "$LINES" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --repo "$GITHUB_REPOSITORY" --comment "No stale or broken source on this run — closing. $RUN" || true
            fi
            exit 0
          fi
          if [ -z "$OPEN" ]; then
            BODY=$(printf 'The daily health check found a City data source that will not mend itself. The site is otherwise clean.\n\n```\n%s\n```\n\nLogs: %s\n' "$LINES" "$RUN")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "City data source needs attention — $(date +%Y-%m-%d)" --body "$BODY" || true
            exit 0
          fi
          SEEN=$(gh issue view "$OPEN" --repo "$GITHUB_REPOSITORY" --json body,comments -q '.body, .comments[].body' | tr -d '0-9,' || true)
          NEW=$(printf '%s\n' "$LINES" | while IFS= read -r L; do
            KEY=$(printf '%s' "$L" | tr -d '0-9,' | cut -c1-40)
            grep -qF -- "$KEY" <<<"$SEEN" || printf '%s\n' "$L"
          done)
          if [ -n "$NEW" ]; then
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$(printf 'Also now:\n\n```\n%s\n```\n\nLogs: %s\n' "$NEW" "$RUN")" || true
          fi
